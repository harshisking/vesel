[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[[project]
name = "vesel"
version = "0.2.0"
description = "A lightweight binary file format for UTF-8 text."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Harsh Barot" }
]

license = "MIT"

keywords = ["file-format", "binary", "serialization", "vesel"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]